name = "steamcommunitx"
main = "worker.js"
compatibility_date = "2026-05-09"

# No routes on purpose: the site is served by the self-hosted Node server, and
# a plain `wrangler deploy` must not take the domain back. Deploying only
# uploads the Worker code. To switch the domain back to the Worker (rollback),
# name the route explicitly:
#   npx wrangler deploy --routes "steamcommunitx.com/*"
workers_dev = false

# BANNERS, MATOMO_URL and MATOMO_SITE_ID are supplied as secrets
# (`wrangler secret put ...`) so a deployment keeps them out of this repo.
# See .dev.vars.example for local development.
[vars]
GA_ID = "G-5ZTR404EG7"

[[kv_namespaces]]
binding = "STEAM_ID_CACHE"
id = "3ddd6b06496d482a9cd55a9d6079e753"

[observability.logs]
enabled = true
invocation_logs = false
