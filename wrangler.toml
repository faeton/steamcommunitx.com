name = "steamcommunitx"
main = "worker.js"
compatibility_date = "2026-05-09"

routes = [
  { pattern = "steamcommunitx.com/*", zone_name = "steamcommunitx.com" }
]

# BANNERS, MATOMO_URL and MATOMO_SITE_ID are supplied as secrets
# (`wrangler secret put ...`) so a deployment keeps them out of this repo.
# See .dev.vars.example for local development.
[vars]
GA_ID = "G-5ZTR404EG7"

[[kv_namespaces]]
binding = "STEAM_ID_CACHE"
id = "3ddd6b06496d482a9cd55a9d6079e753"

[observability.logs]
enabled = true
invocation_logs = false
